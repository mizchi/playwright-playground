name: ci
on: [push, pull_request]

jobs:
  e2e:
    # VRT baselines are committed as linux/arm64 (generated via `pnpm baseline:linux`
    # on a local arm64 container). The runner arch MUST match the baseline arch, so
    # use an arm64 runner. If you switch to ubuntu-latest (amd64), regenerate the
    # baselines on amd64 — cross-arch font rendering differs.
    runs-on: ubuntu-24.04-arm
    # Same image as baseline:linux so VRT matches.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 再現性確認: 連続2回。VRT diff も含む。
      - run: pnpm exec playwright test
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
