# On a VRT failure, a model decides accept / reject / needs-review.
#   accept       -> baselines refreshed in CI and committed back to the PR branch
#   reject       -> job fails (regression)
#   needs-review -> job fails with a warning (a human decides)
#
# Arch/pnpm match ci.yml: baselines are linux/arm64, so this MUST run on an arm64
# runner with the same Playwright container, or every screenshot diffs on font
# rendering alone and the review is meaningless.
#
# Requires an OPENROUTER_API_KEY repo secret.
name: vrt-review
on: [pull_request]

jobs:
  vrt:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write   # to commit accepted baselines back to the PR branch
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR's head branch (not the detached merge commit) so the
          # accepted-baseline commit can be pushed back to it.
          ref: ${{ github.head_ref }}
          # Full history + all branches so collectGitContext can diff against
          # origin/<base> and read the commit intent. The default shallow,
          # single-branch checkout leaves origin/main absent -> intent is starved
          # and the model returns needs-review instead of accept/reject.
          fetch-depth: 0
      # The Playwright container runs as root while the checkout is owned by a
      # different uid; without this git refuses every command ("dubious ownership"
      # / "Not a git repository"), which breaks the commit-back step.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Make origin/<base> resolvable so collectGitContext can diff against it.
      - if: github.base_ref != ''
        run: git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      # No `version:` — package.json's packageManager (pnpm@9.0.0) drives it.
      # Pinning both makes pnpm/action-setup@v4 fail with "Multiple versions specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - id: vrt
        run: pnpm exec playwright test
        continue-on-error: true   # let the review step interpret a VRT failure

      - name: Review VRT failure with a model
        if: steps.vrt.outcome == 'failure'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        # tsx, not bare node: @mizchi/vlmkit-heal ships .ts sources, and Node won't
        # type-strip files under node_modules (ERR_UNSUPPORTED_NODE_MODULES_TYPE_STRIPPING).
        run: npx tsx vrt-review.mjs   # exits 0 on accept (snapshots updated), 1 on reject/needs-review

      - name: Commit accepted baselines
        # only reached when the review step exited 0 (accept) and changed snapshots
        if: steps.vrt.outcome == 'failure'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "test: update VRT baselines (model-reviewed) [skip ci]"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Pass through a real VRT pass
        if: steps.vrt.outcome == 'success'
        run: echo "VRT green"
